thresholds:
  upgrade_min_resource: 10000000
  match_min_gold: 1000000
  match_min_elixir: 1000000
  require_both_for_wall_upgrade: false

vision:
  # Template-matching mode (no YOLO).
  use_ocr: true

search:
  max_skips_before_attack: 6

ocr_stability:
  median_window: 3
  fields:
    home_gold:
      min_value: 0
      max_value: 20000000
      min_digits: 6
      max_digits: 8
      max_abs_delta: 1200000
      max_ratio: 1.25
    home_elixir:
      min_value: 0
      max_value: 20000000
      min_digits: 6
      max_digits: 8
      max_abs_delta: 1200000
      max_ratio: 1.25
    enemy_gold:
      min_value: 0
      max_value: 7000000
      min_digits: 4
      max_digits: 7
      max_abs_delta: null
      max_ratio: null
    enemy_elixir:
      min_value: 0
      max_value: 7000000
      min_digits: 4
      max_digits: 7
      max_abs_delta: null
      max_ratio: null

